;background:#f0f4e6;border-radius:22px;padding:15px;transform:rotate(-9deg)}.object:nth-child(2){transform:rotate(9deg);margin-top:25px;background:var(--lime)}.art-foot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#deebdf}.art-foot strong{display:block;color:white;font-size:20px}.search-panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #163b3006}.search-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}input,select{width:100%;min-height:48px;border:1px solid #d5ddd1;border-radius:9px;background:#fafbf7;color:var(--ink);padding:10px 12px}input::placeholder{color:#737c74}.filter-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;font-size:12px;color:var(--muted)}.text-button{background:transparent;border:0;text-decoration:underline;color:var(--green);padding:5px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:38px 0 20px}h2{font-size:26px;letter-spacing:-.7px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.section-head>span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.visual{height:170px;display:grid;place-items:center;position:relative;background:var(--tint)}.visual .emoji{font-size:70px;filter:drop-shadow(0 12px 8px #163b3015)}.sample{position:absolute;top:12px;left:12px;background:#fffffff0;padding:4px 8px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.6px}.card-body{padding:18px}.category{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#67785c}.card h3{font-size:18px;margin:6px 0}.location{font-size:12px;color:var(--muted);margin:0 0 16px}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-weight:800;font-size:21px}.price small{font-size:12px;color:var(--muted);font-weight:400}.details{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:650}.empty{padding:45px;text-align:center;background:white;border:1px dashed var(--line);border-radius:15px}.how{margin:48px 0;background:#eaf0df;border-radius:22px;padding:30px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:22px}.step-num{display:inline-grid;place-items:center;background:white;border-radius:50%;height:30px;width:30px;font-size:12px;font-weight:800}.steps h3{font-size:16px;margin:10px 0 6px}.steps p{font-size:13px;color:var(--muted);margin:0}footer{border-top:1px solid var(--line);padding:24px 0 36px;font-size:12px;color:var(--muted)}.footer-row{display:flex;justify-content:space-between;gap:20px}dialog{max-width:470px;width:calc(100% - 32px);border:0;border-radius:20px;padding:28px;color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#102e27aa}dialog h2{font-size:24px;margin:12px 0}dialog p{color:var(--muted)}.close{background:var(--green);color:white;border:0;border-radius:9px;padding:11px 20px;width:100%;margin-top:12px}.demo-tag{font-size:11px;font-weight:800;color:#6b5c20;background:#fbefc9;border-radius:5px;padding:5px 8px;display:inline-block}[hidden]{display:none!important}@media(max-width:760px){.wrap{padding-left:18px;padding-right:18px}nav{min-height:70px}.brand{font-size:20px}.nav-link{font-size:12px}.hero{grid-template-columns:1fr;gap:26px;padding-top:34px;padding-bottom:30px}h1{letter-spacing:-1.8px;margin:16px 0}.lead{font-size:16px}.hero-art{min-height:220px;padding:22px}.objects{padding:8px}.object{font-size:43px;padding:12px}.search-grid{grid-template-columns:1fr 1fr}.search-field{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.visual{height:140px}.visual .emoji{font-size:55px}.card-body{padding:13px}.card h3{font-size:16px}.card-bottom{align-items:start;flex-direction:column}.details{width:100%}.section-head{align-items:start}.steps{grid-template-columns:1fr;gap:22px}.how{padding:24px}.footer-row{flex-direction:column;gap:7px}.section-head>span{max-width:90px;text-align:right}}@media(max-width:360px){.grid{grid-template-columns:1fr}.card-bottom{flex-direction:row}.details{width:auto}.brand{font-size:18px}.nav-link{font-size:11px}}@media(prefers-reduced-motion:no-preference){.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #163b3010}}

.list-button{background:var(--green);color:white;border:0;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700}.form-dialog{max-width:600px;max-height:90vh;overflow:auto}.form-dialog label{margin-top:14px}.form-dialog textarea{width:100%;min-height:110px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:9px}.check{display:flex;gap:10px;align-items:start;font-weight:400!important}.check input{width:18px;min-height:18px;flex-shrink:0}.form-actions{display:flex;gap:12px;margin-top:20px}.form-actions button{flex:1}.form-status{font-size:14px}.photo{width:100%;height:100%;object-fit:cover}.detail-photo{width:100%;max-height:260px;object-fit:contain;border-radius:10px}.setup-status{color:var(--muted);font-size:13px;margin:14px 0}.trap{display:none}
</style></head><body><main class="wrap" style="padding-top:40px;padding-bottom:40px"><a href="/">← Back to marketplace</a><h1 style="font-size:36px">Review listings</h1><p>Approve only items you have checked. Approval publishes the item's details and photo. Rejected items stay private; delete removes an item permanently.</p><form id="login"><label for="key">Admin key</label><input id="key" type="password" required minlength="32" autocomplete="off"><button class="list-button" style="margin-top:12px">Unlock / refresh</button><button class="details" id="lock" type="button">Lock</button></form><p role="status" id="status"></p><div id="queue"></div></main><script>
let token='';
const status=document.querySelector('#status');const queue=document.querySelector('#queue');
function clear(){token='';document.querySelector('#key').value='';queue.replaceChildren();status.textContent='Locked.';}
document.querySelector('#lock').onclick=clear;
async function api(method='GET',payload){const response=await fetch('/api/admin',{method,headers:{Authorization:'Bearer '+token,...(payload?{'Content-Type':'application/json'}:{})},...(payload?{body:JSON.stringify(payload)}:{})});let data;try{data=await response.json();}catch{throw Error('Admin service is not connected yet.');}if(!response.ok)throw Error(data.error||'Request failed.');return data;}
async function refresh(){
 queue.replaceChildren();status.textContent='Loading…';
 try{const data=await api();status.textContent=data.listings.length+' submitted listings';
 for(const item of data.listings){
  const card=document.createElement('article');card.className='search-panel';card.style.marginBottom='16px';
  const title=document.createElement('h2');title.textContent=item.name;card.append(title);
  for(const value of [item.status.toUpperCase()+' · '+item.created_at,item.city+', '+item.province+' · '+item.category,'PHP '+item.price+' / day',item.description,'Reference: '+item.id]){const p=document.createElement('p');p.textContent=value;card.append(p);}
  if(item.image){const image=document.createElement('img');image.src=item.image;image.className='detail-photo';image.alt=item.name;card.append(image);}
  const actions=document.createElement('div');actions.className='form-actions';
  for(const [label,value] of [['Approve','approved'],['Reject / unpublish','rejected'],['Delete','delete']]){
   const button=document.createElement('button');button.type='button';button.className='details';button.textContent=label;
   button.onclick=async()=>{if(value==='delete'&&!confirm('Permanently delete this listing and its photo?'))return;for(const b of actions.children)b.disabled=true;try{await api('POST',{id:item.id,status:value});await refresh();}catch(error){status.textContent=error.message;for(const b of actions.children)b.disabled=false;}};actions.append(button);
  }card.append(actions);queue.append(card);
 }
 }catch(error){status.textContent=error.message;}
}
document.querySelector('#login').onsubmit=event=>{event.preventDefault();token=document.querySelector('#key').value;document.querySelector('#key').value='';refresh();};
// Key stays in memory only. A refresh or Lock removes it.
</script></body></html>
